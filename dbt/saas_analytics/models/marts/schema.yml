version: 2

models:
  - name: mart_pipeline_health
    description: >
      Condensed operational health view across raw sources and the latest ingestion activity.
      Combines freshness, latest file event status, and latest pipeline run outcomes into a
      reviewer-friendly monitoring surface.
    columns:
      - name: source_table
        description: Raw source table being monitored.
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - raw_accounts
                  - raw_subscriptions
                  - raw_feature_usage
                  - raw_support_tickets
                  - raw_churn_events

      - name: latest_loaded_at
        description: Most recent technical load timestamp observed for the raw source.
        tests:
          - not_null

      - name: raw_record_count
        description: Current number of records present in the raw source table.
        tests:
          - not_null

      - name: hours_since_last_load
        description: Hours elapsed since the raw source was last loaded.
        tests:
          - not_null

      - name: freshness_status
        description: Freshness status derived from the same thresholds used by dbt source freshness.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fresh', 'warning', 'stale']

      - name: latest_ingestion_run_id
        description: Ingestion run identifier associated with the latest file event for the source.

      - name: latest_run_status
        description: Final status of the latest ingestion run touching the source.
        tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed']

      - name: latest_source_file_name
        description: Name of the latest source file observed for the raw source.

      - name: latest_file_status
        description: Status of the latest file-level ingestion event for the source.
        tests:
          - accepted_values:
              arguments:
                values: ['success', 'skipped', 'failed']

      - name: pipeline_health_status
        description: High-level operational status for the source, derived from freshness and latest run outcomes.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['healthy', 'monitor', 'critical']

  - name: mart_ingestion_file_loads
    description: >
      File-level operational mart for the ingestion pipeline. Exposes one record per file event,
      including load status, file metadata, timing, and run context for operational debugging.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "row_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "source_file_size_bytes >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "seconds_from_run_start_to_file_event is null or seconds_from_run_start_to_file_event >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rows_per_byte is null or rows_per_byte >= 0"
    columns:
      - name: ingestion_run_id
        description: Unique ingestion run identifier associated with the file event.
        tests:
          - not_null

      - name: table_name
        description: Raw target table that received or skipped the file.
        tests:
          - not_null

      - name: source_file_name
        description: Name of the CSV file processed by the ingestion step.
        tests:
          - not_null

      - name: source_file_size_bytes
        description: Size of the source file in bytes.

      - name: source_last_modified_at
        description: Last modified timestamp of the local source file at ingestion time.

      - name: source_file_sha256
        description: SHA256 checksum of the source file used for lightweight idempotency.
        tests:
          - not_null

      - name: row_count
        description: Number of rows observed for the file event.
        tests:
          - not_null

      - name: loaded_at
        description: Timestamp when the file event was recorded.
        tests:
          - not_null

      - name: file_status
        description: Final status of the file event.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'skipped', 'failed']

      - name: error_message
        description: File-level error message, if the file event failed or was skipped.

      - name: pipeline_name
        description: Name of the pipeline that created the file event.

      - name: run_status
        description: Final status of the parent ingestion run.
        tests:
          - accepted_values:
              arguments:
                values: ['running', 'success', 'failed']

      - name: run_started_at
        description: Timestamp when the parent ingestion run started.

      - name: run_finished_at
        description: Timestamp when the parent ingestion run finished.

      - name: seconds_from_run_start_to_file_event
        description: Seconds elapsed between run start and the file-level audit event.

      - name: rows_per_byte
        description: Lightweight density metric for comparing file size and ingested row count.

  - name: mart_ingestion_runs
    description: >
      Operational run-history mart for the raw ingestion layer. Summarizes each ingestion run,
      including loaded, skipped, and failed files, plus simple run-level observability metrics.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "files_expected = files_loaded + files_skipped + files_failed"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "file_event_count = successful_file_count + skipped_file_count + failed_file_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "run_duration_seconds is null or run_duration_seconds >= 0"
    columns:
      - name: ingestion_run_id
        description: Unique identifier propagated across ingestion tasks for a single pipeline run.
        tests:
          - not_null
          - unique

      - name: pipeline_name
        description: Name of the pipeline that created the ingestion run.

      - name: run_status
        description: Final status of the ingestion run.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['running', 'success', 'failed']

      - name: run_started_at
        description: Timestamp when the ingestion run started.

      - name: run_finished_at
        description: Timestamp when the ingestion run finished.

      - name: run_duration_seconds
        description: Total runtime of the ingestion run in seconds.

      - name: files_expected
        description: Number of files expected for the ingestion run.
        tests:
          - not_null

      - name: files_loaded
        description: Number of files newly loaded during the ingestion run.
        tests:
          - not_null

      - name: files_skipped
        description: Number of files skipped because the same checksum had already been loaded.
        tests:
          - not_null

      - name: files_failed
        description: Number of files that failed during the ingestion run.
        tests:
          - not_null

      - name: file_event_count
        description: Total number of file-level audit events recorded for the ingestion run.

      - name: successful_file_count
        description: Number of file-level audit events with success status.

      - name: skipped_file_count
        description: Number of file-level audit events with skipped status.

      - name: failed_file_count
        description: Number of file-level audit events with failed status.

      - name: total_rows_observed
        description: Total number of rows observed across successful file loads in the run.

      - name: file_accounting_complete
        description: Indicates whether expected file counts reconcile with loaded, skipped, and failed totals.
        tests:
          - not_null

      - name: error_message
        description: Final run-level error message, if the ingestion run failed.

  - name: mart_churn_analysis
    description: >
      Account-level churn analytics mart combining account attributes, subscription metrics,
      support metrics, and churn outcomes. Used to analyze churn patterns by customer,
      plan, support experience, and revenue profile.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "churn_flag = false or churn_event_count >= 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "account_lifetime_days is null or account_lifetime_days >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "mrr_per_seat is null or mrr_per_seat >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "support_tickets_per_subscription is null or support_tickets_per_subscription >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "usage_events_per_subscription is null or usage_events_per_subscription >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "usage_intensity_per_day is null or usage_intensity_per_day >= 0"
    columns:
      - name: account_id
        description: Unique identifier of the SaaS account.
        tests:
          - not_null
          - unique

      - name: account_name
        description: Name of the SaaS customer account.

      - name: industry
        description: Industry segment of the customer account.

      - name: country
        description: Country of the customer account.

      - name: signup_date
        description: Date when the account signed up.

      - name: referral_source
        description: Acquisition or referral source of the account.

      - name: plan_tier
        description: Current or associated subscription plan tier.

      - name: seats
        description: Number of seats associated with the account.

      - name: churn_flag
        description: Boolean flag indicating whether the account is marked as churned.
        tests:
          - not_null

      - name: subscription_count
        description: Number of subscriptions associated with the account.

      - name: total_mrr_amount
        description: Total monthly recurring revenue associated with the account.

      - name: avg_mrr_amount
        description: Average monthly recurring revenue per subscription for the account.

      - name: max_mrr_amount
        description: Maximum monthly recurring revenue among the account's subscriptions.

      - name: upgrade_count
        description: Number of upgrade events associated with the account.

      - name: downgrade_count
        description: Number of downgrade events associated with the account.

      - name: support_ticket_count
        description: Number of support tickets associated with the account.

      - name: avg_resolution_time_hours
        description: Average support ticket resolution time in hours.

      - name: avg_first_response_time_minutes
        description: Average first response time in minutes across support tickets.

      - name: avg_satisfaction_score
        description: Average customer satisfaction score across support tickets.

      - name: escalation_count
        description: Number of escalated support tickets associated with the account.

      - name: usage_event_count
        description: Number of feature usage events associated with the account.

      - name: active_usage_days
        description: Number of distinct days on which the account recorded product usage.

      - name: distinct_features_used
        description: Number of distinct product features used by the account.

      - name: total_usage_count
        description: Total usage count across all recorded feature usage events for the account.

      - name: avg_usage_count_per_event
        description: Average usage count per feature usage event for the account.

      - name: total_usage_duration_secs
        description: Total recorded usage duration in seconds across all feature usage events.

      - name: avg_usage_duration_secs
        description: Average recorded usage duration in seconds per feature usage event.

      - name: total_error_count
        description: Total number of errors recorded across all feature usage events for the account.

      - name: avg_error_count_per_event
        description: Average number of errors per feature usage event for the account.

      - name: beta_feature_event_count
        description: Number of feature usage events involving beta features for the account.

      - name: beta_feature_event_rate
        description: Share of feature usage events involving beta features for the account.

      - name: last_usage_date
        description: Most recent date on which the account recorded product usage.

      - name: mrr_per_seat
        description: Monthly recurring revenue divided by the number of seats associated with the account.

      - name: support_tickets_per_subscription
        description: Average number of support tickets per subscription associated with the account.

      - name: usage_events_per_subscription
        description: Average number of feature usage events per subscription associated with the account.

      - name: usage_intensity_per_day
        description: Average usage count per active usage day for the account.

      - name: error_rate_per_usage
        description: Average number of recorded errors per unit of usage count for the account.

      - name: days_from_last_usage_to_churn
        description: Number of days between the account's last observed product usage and first churn date.

      - name: account_lifetime_days
        description: Number of days between signup and the account's first churn date.

      - name: beta_feature_adopter_flag
        description: Boolean flag indicating whether at least 20 percent of usage events involved beta features.

      - name: first_churn_date
        description: First known churn date for the account.

      - name: churn_event_count
        description: Number of churn events associated with the account.

      - name: latest_reason_code
        description: Latest known churn reason code for the account.

      - name: total_refund_amount_usd
        description: Total refunded amount in USD associated with churn events for the account.

  - name: mart_revenue_by_month
    description: >
      Monthly revenue analytics mart aggregated by revenue month, plan tier, and billing frequency.
      Used to analyze MRR, ARR, customer counts, subscription counts, upgrades, downgrades,
      and churned subscriptions over time.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - revenue_month
              - plan_tier
              - billing_frequency
      - dbt_utils.expression_is_true:
          arguments:
            expression: "account_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "subscription_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_mrr_amount >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_arr_amount >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "churned_subscription_count <= subscription_count"
    columns:
      - name: revenue_month
        description: Month associated with the recurring revenue aggregation.
        tests:
          - not_null

      - name: plan_tier
        description: Subscription plan tier for the monthly revenue aggregation.
        tests:
          - not_null

      - name: billing_frequency
        description: Billing frequency of the subscription, such as monthly or annual.
        tests:
          - not_null

      - name: account_count
        description: Number of distinct accounts in the revenue aggregation.
        tests:
          - not_null

      - name: subscription_count
        description: Number of subscriptions in the revenue aggregation.
        tests:
          - not_null

      - name: total_mrr_amount
        description: Total monthly recurring revenue for the aggregation.
        tests:
          - not_null

      - name: total_arr_amount
        description: Total annual recurring revenue for the aggregation.
        tests:
          - not_null

      - name: avg_mrr_amount
        description: Average monthly recurring revenue for the aggregation.

      - name: avg_seats
        description: Average number of seats for the aggregation.

      - name: upgrade_count
        description: Number of upgrade events in the aggregation.

      - name: downgrade_count
        description: Number of downgrade events in the aggregation.

      - name: churned_subscription_count
        description: Number of churned subscriptions in the aggregation.
