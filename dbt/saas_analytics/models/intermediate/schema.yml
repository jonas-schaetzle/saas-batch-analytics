version: 2

models:
  - name: int_account_subscription_summary
    description: >
      Account-level subscription summary with aggregated MRR and subscription movement metrics.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "subscription_count >= 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_mrr_amount >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "upgrade_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "downgrade_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "max_mrr_amount >= avg_mrr_amount"
    columns:
      - name: account_id
        description: Unique identifier of the SaaS account.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: subscription_count
        description: Number of subscriptions associated with the account.
        tests:
          - not_null

      - name: total_mrr_amount
        description: Total monthly recurring revenue amount across all subscriptions for the account.
        tests:
          - not_null

      - name: avg_mrr_amount
        description: Average monthly recurring revenue amount per subscription for the account.

      - name: max_mrr_amount
        description: Highest monthly recurring revenue amount among the account's subscriptions.

      - name: upgrade_count
        description: Number of subscription upgrade events associated with the account.

      - name: downgrade_count
        description: Number of subscription downgrade events associated with the account.

  - name: int_account_churn_summary
    description: >
      Account-level churn summary with churn event counts, first churn date, latest churn reason,
      and total refunded amount.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "churn_event_count >= 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_refund_amount_usd >= 0"
    columns:
      - name: account_id
        description: Unique identifier of the SaaS account.
        tests:
          - not_null
          - unique

      - name: first_churn_date
        description: First known churn date for the account.

      - name: churn_event_count
        description: Number of churn events associated with the account.
        tests:
          - not_null

      - name: latest_reason_code
        description: Most recent recorded churn reason code for the account.

      - name: total_refund_amount_usd
        description: Total refunded amount in USD associated with churn events for the account.

  - name: int_account_support_summary
    description: >
      Account-level support summary with support volume, resolution speed, first response time,
      satisfaction, and escalation metrics.
    columns:
      - name: account_id
        description: Unique identifier of the SaaS account.
        tests:
          - not_null
          - unique

      - name: support_ticket_count
        description: Number of support tickets associated with the account.
        tests:
          - not_null

      - name: avg_resolution_time_hours
        description: Average time in hours required to resolve support tickets.

      - name: avg_first_response_time_minutes
        description: Average time in minutes until the first response to support tickets.

      - name: avg_satisfaction_score
        description: Average customer satisfaction score across support tickets.

      - name: escalation_count
        description: Number of escalated support tickets associated with the account.

  - name: int_account_usage_summary
    description: >
      Account-level product usage summary with activity frequency, breadth of feature adoption,
      usage duration, error volume, beta feature adoption, and latest observed activity date.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "usage_event_count >= active_usage_days"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "usage_event_count >= distinct_features_used"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_usage_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_error_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "beta_feature_event_count <= usage_event_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "beta_feature_event_rate >= 0 and beta_feature_event_rate <= 1"
    columns:
      - name: account_id
        description: Unique identifier of the SaaS account.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: usage_event_count
        description: Number of feature usage events associated with the account.
        tests:
          - not_null

      - name: active_usage_days
        description: Number of distinct days on which the account recorded product usage.
        tests:
          - not_null

      - name: distinct_features_used
        description: Number of distinct product features used by the account.
        tests:
          - not_null

      - name: total_usage_count
        description: Total usage count across all recorded feature usage events for the account.
        tests:
          - not_null

      - name: avg_usage_count_per_event
        description: Average usage count per feature usage event for the account.

      - name: total_usage_duration_secs
        description: Total recorded usage duration in seconds across all feature usage events.
        tests:
          - not_null

      - name: avg_usage_duration_secs
        description: Average recorded usage duration in seconds per feature usage event.

      - name: total_error_count
        description: Total number of errors recorded across all feature usage events for the account.
        tests:
          - not_null

      - name: avg_error_count_per_event
        description: Average number of errors per feature usage event for the account.

      - name: beta_feature_event_count
        description: Number of feature usage events involving beta features for the account.
        tests:
          - not_null

      - name: beta_feature_event_rate
        description: Share of feature usage events involving beta features for the account.

      - name: last_usage_date
        description: Most recent date on which the account recorded product usage.
