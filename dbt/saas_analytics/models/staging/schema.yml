version: 2

models:
  - name: stg_accounts
    columns:
      - name: account_id
        tests:
          - not_null
          - unique
      - name: referral_source
        tests:
          - accepted_values:
              arguments:
                values: ['organic', 'ads', 'event', 'partner', 'other']
      - name: plan_tier
        tests:
          - accepted_values:
              arguments:
                values: ['Basic', 'Pro', 'Enterprise']

  - name: stg_subscriptions
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_date is null or end_date >= start_date"
    columns:
      - name: subscription_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: plan_tier
        tests:
          - accepted_values:
              arguments:
                values: ['Basic', 'Pro', 'Enterprise']
      - name: billing_frequency
        tests:
          - accepted_values:
              arguments:
                values: ['monthly', 'annual']
      - name: seats
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: mrr_amount
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: arr_amount
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_feature_usage
    columns:
      - name: usage_id
        tests:
          - not_null
          # - unique
      - name: subscription_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: usage_count
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: usage_duration_secs
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: error_count
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_support_tickets
    columns:
      - name: ticket_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: priority
        tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high', 'urgent']
      - name: resolution_time_hours
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: first_response_time_minutes
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_churn_events
    columns:
      - name: churn_event_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: refund_amount_usd
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
