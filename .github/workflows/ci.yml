name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint Python with Ruff
        run: ruff check .

      - name: Validate Airflow DAG syntax
        run: python -m py_compile airflow/dags/saas_batch_pipeline.py

      - name: Lint SQL with SQLFluff
        run: sqlfluff lint dbt/saas_analytics/models

      - name: Build dbt project
        working-directory: dbt/saas_analytics
        run: dbt build --profiles-dir . --target dev
