name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  fast-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        working-directory: dbt/saas_analytics
        run: dbt deps --profiles-dir .

      - name: Lint Python with Ruff
        run: ruff check . --cache-dir /tmp/ruff-cache

      - name: Validate Airflow DAG syntax
        run: python -m py_compile airflow/dags/saas_batch_pipeline.py

      - name: Lint SQL with SQLFluff
        working-directory: dbt/saas_analytics
        run: sqlfluff lint models

  full-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        working-directory: dbt/saas_analytics
        run: dbt deps --profiles-dir .

      - name: Build dbt project
        working-directory: dbt/saas_analytics
        run: dbt build --profiles-dir . --target dev
