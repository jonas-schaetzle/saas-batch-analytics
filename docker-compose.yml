services:
  postgres:
    image: postgres:16
    container_name: saas_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"

  airflow-cli:
    build: .
    image: saas-airflow:3.2.1
    container_name: saas_airflow_cli
    profiles:
      - debug
    depends_on:
      - postgres
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data
    command: bash
    env_file:
      - .env

  airflow-init:
    build: .
    image: saas-airflow:3.2.1
    container_name: saas_airflow_init
    depends_on:
      - postgres
    environment:
      <<: *airflow-common-env
    command: >
      bash -c "
      airflow db migrate
      "
    volumes: *airflow-common-volumes
    env_file:
      - .env

  airflow-api-server:
    build: .
    image: saas-airflow:3.2.1
    container_name: saas_airflow_api_server
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: airflow api-server
    env_file:
      - .env

  airflow-scheduler:
    build: .
    image: saas-airflow:3.2.1
    container_name: saas_airflow_scheduler
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow scheduler
    env_file:
      - .env

  airflow-dag-processor:
    build: .
    image: saas-airflow:3.2.1
    container_name: saas_airflow_dag_processor
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow dag-processor
    env_file:
      - .env
